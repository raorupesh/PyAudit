[project]
name = "pyaudit"
version = "0.1.0"
description = "Automated Python code quality reporter — complexity, static analysis, dead code, security, dependencies, and coverage in one report."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "radon>=6.0",
    "jinja2>=3.1",
    "pylint>=3.0",
    "vulture>=2.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "coverage>=7.0",
    "pytest>=7.0",
]

[project.scripts]
pyaudit = "pyaudit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyaudit*"]

[tool.setuptools.package-data]
"pyaudit.report" = ["templates/*.j2"]
